name: build
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # Keep this job name stable: it is the required status check for merging
  # pull requests (including Dependabot dependency updates).
  example-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: yarn
          cache-dependency-path: |
            yarn.lock
            example/yarn.lock
      - name: Build root package
        run: yarn install --frozen-lockfile && yarn build
      - name: Build example
        working-directory: example
        run: yarn install --frozen-lockfile && yarn build
